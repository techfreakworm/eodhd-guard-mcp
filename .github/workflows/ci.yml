name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the maintainer run the secret scan over the full history by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No job calls the EODHD API. The live and contract test markers skip themselves unless
# EODHD_GUARD_LIVE or EODHD_GUARD_EVAL_CACHE is set, and CI sets neither.
jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=eodhd_guard_mcp --cov-report=term-missing --cov-fail-under=85

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/eodhd-guard-mcp" --version

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action scans "<first pushed commit>^..<last pushed commit>". When a push creates the branch,
    # the first commit has no parent, so that range is invalid. Skip that one push and run the
    # workflow by hand (Actions tab, "Run workflow") to scan the full history instead.
    if: ${{ github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal account needs no GITLEAKS_LICENSE. A repository owned by an organisation does.
          # .gitleaks.toml uses [[allowlists]], which needs gitleaks 8.25 or later, and the action's
          # built-in default is older. Keep this in step with the rev in .pre-commit-config.yaml.
          GITLEAKS_VERSION: "8.30.1"
          # The token is read-only here, so the action cannot comment on pull requests.
          GITLEAKS_ENABLE_COMMENTS: "false"
